<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ev Launcher</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "Samsung One", "Segoe UI", Arial, sans-serif; color: #f2f2f2;
    background: radial-gradient(ellipse at 20% 10%, #23324a 0%, #10151f 55%, #07090d 100%);
  }
  header { display: flex; justify-content: space-between; align-items: flex-end; padding: 90px 140px 0; }
  #clock { font-size: 120px; font-weight: 200; letter-spacing: 2px; }
  #date { font-size: 34px; opacity: .65; margin-top: 6px; }
  #greet { font-size: 40px; opacity: .8; text-align: right; }
  #grid { display: flex; flex-wrap: wrap; gap: 40px; padding: 110px 140px 0; }
  .tile {
    width: 380px; height: 250px; border-radius: 28px; padding: 34px 36px; position: relative;
    display: flex; flex-direction: column; justify-content: space-between;
    background: rgba(255,255,255,.06); border: 3px solid rgba(255,255,255,.08);
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .tile .icon {
    width: 86px; height: 86px; border-radius: 22px; display: flex; align-items: center; justify-content: center;
    font-size: 46px; font-weight: 700; color: #fff;
  }
  .tile .name { font-size: 46px; font-weight: 600; }
  .tile .sub { font-size: 26px; opacity: .6; margin-top: 4px; }
  .tile.focus { transform: scale(1.06); background: rgba(255,255,255,.16); border-color: #fff; }
  .tile.missing { opacity: .35; }
  #toast {
    position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%);
    background: rgba(0,0,0,.75); padding: 22px 44px; border-radius: 18px; font-size: 30px;
    opacity: 0; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
  #hint { position: absolute; left: 140px; bottom: 60px; font-size: 24px; opacity: .4; }
  #all {
    position: absolute; top: 0; right: 0; width: 760px; height: 1080px; padding: 70px 60px;
    background: rgba(8,10,14,.96); box-shadow: -20px 0 60px rgba(0,0,0,.6);
    transform: translateX(100%); transition: transform .2s ease;
  }
  #all.show { transform: translateX(0); }
  #all h2 { font-size: 44px; font-weight: 600; margin-bottom: 30px; }
  #all-list { height: 880px; overflow: hidden; position: relative; }
  #all-list .app { font-size: 34px; padding: 18px 26px; border-radius: 14px; opacity: .75; }
  #all-list .app.focus { background: rgba(255,255,255,.16); opacity: 1; }
</style>
</head>
<body>
<header>
  <div><div id="clock">--:--</div><div id="date"></div></div>
  <div id="greet"></div>
</header>
<div id="grid"></div>
<div id="hint">OK: aç · Geri: TizenBrew · Home: Samsung menüsü</div>
<div id="all"><h2>Tüm uygulamalar</h2><div id="all-list"></div></div>
<div id="toast"></div>
<script src="launcher.js"></script>
</body>
</html>
