<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yıldız Ailesi Ev Eğlence Sistemi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    position: relative; font-family: "Samsung One", "Segoe UI", Arial, sans-serif;
    background: #0d1118; color: #f2f2f2; transition: background 1s ease, color .3s ease;
  }
  /* temalar: arka plan + yazi rengi + kutucuk tonlari */
  body.t-navy   { background: radial-gradient(ellipse at 15% 0%, #1d2a3e 0%, #0d1118 60%, #07090d 100%); }
  body.t-anth   { background: linear-gradient(160deg, #2b2e33 0%, #111214 100%); }
  body.t-green  { background: linear-gradient(160deg, #1f3a2e 0%, #0a140f 100%); }
  body.t-bordo  { background: linear-gradient(160deg, #4a1d26 0%, #14070a 100%); }
  body.t-purple { background: linear-gradient(160deg, #33244d 0%, #0d0915 100%); }
  body.t-cream  { background: linear-gradient(160deg, #f6f1e7 0%, #e9e1d2 100%); color: #1f2329; }
  body.t-grey   { background: linear-gradient(160deg, #eef0f3 0%, #d9dde3 100%); color: #1f2329; }
  body.t-morning { background: linear-gradient(160deg, #3a3f63 0%, #c9826b 100%); }
  body.t-day     { background: linear-gradient(160deg, #3d6e9e 0%, #1c3550 100%); }
  body.t-evening { background: linear-gradient(160deg, #4b2f5e 0%, #1a1426 100%); }
  body.t-night   { background: linear-gradient(160deg, #0b1220 0%, #04060a 100%); }
  .tile, .line, .side, .btn, .field, .res-item, .chip-wrap { background: rgba(255,255,255,.06); }
  body.light .tile, body.light .line, body.light .btn, body.light .field, body.light .res-item { background: rgba(0,0,0,.05); }
  body.light .side { background: rgba(0,0,0,.06); }
  .f { border-color: #fff !important; }
  body.light .f { border-color: #1f2329 !important; }

  /* ana ekran */
  #home { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; }
  .top { position: absolute; left: 150px; top: 60px; font-size: 32px; opacity: .55; }
  .top b { font-weight: 600; }
  .title { position: absolute; left: 150px; top: 116px; font-size: 66px; font-weight: 600; letter-spacing: .5px; }
  #gear {
    position: absolute; right: 150px; top: 128px; width: 64px; height: 64px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 36px; opacity: .4;
    border: 3px solid transparent;
  }
  #gear.f { opacity: 1; background: rgba(128,128,128,.25); }
  .viewport { position: absolute; left: 150px; width: 1620px; height: 270px; overflow: hidden; }
  #vp0 { top: 340px; } #vp1 { top: 660px; }
  .row { display: flex; padding: 20px 0 0 10px; transition: transform .2s ease; }
  .tile {
    flex: 0 0 360px; width: 360px; height: 230px; margin-right: 44px; border-radius: 30px;
    border: 3px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform .15s ease;
  }
  .tile.f { transform: scale(1.07); background: rgba(128,128,128,.22); }
  .tile.missing { opacity: .35; }
  .logo {
    width: 77px; height: 77px; border-radius: 19px; margin-bottom: 24px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 700; color: #fff;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .logo.site { background: #fff; padding: 10px; }
  .logo.plus { border: 3px solid currentColor; color: inherit; opacity: .5; font-weight: 300; }
  .name { font-size: 32px; font-weight: 600; max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* hava durumu (sag alt) */
  #weather { position: absolute; right: 150px; top: 680px; height: 230px; display: none; align-items: center; }
  #weather.on { display: flex; }
  .wnow { display: flex; align-items: center; padding-right: 36px; margin-right: 6px; border-right: 2px solid rgba(128,128,128,.35); }
  .wnow svg { width: 96px; height: 96px; margin-right: 18px; }
  .wnow .t { font-size: 64px; font-weight: 300; line-height: 1; }
  .wnow .c { font-size: 24px; opacity: .55; margin-top: 6px; }
  .wday { text-align: center; margin-left: 30px; }
  .wday .d { font-size: 22px; opacity: .55; }
  .wday svg { width: 56px; height: 56px; margin: 6px 0; }
  .wday .r { font-size: 24px; } .wday .r span { opacity: .55; }

  /* ayarlar */
  #settings { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; display: none; }
  #settings.on { display: flex; }
  .side { width: 520px; height: 1080px; padding: 90px 50px; }
  .side h1 { font-size: 46px; font-weight: 600; margin: 0 0 50px 24px; }
  .menu-it { font-size: 32px; padding: 22px 26px; border-radius: 16px; opacity: .6; margin-bottom: 8px; border: 3px solid transparent; }
  .menu-it.sel { background: rgba(128,128,128,.2); opacity: 1; }
  .main { flex: 1; padding: 90px 110px; position: relative; height: 1080px; overflow: hidden; }
  .main h2 { font-size: 40px; font-weight: 600; margin-bottom: 14px; }
  .main .note { font-size: 26px; opacity: .5; margin-bottom: 36px; }
  #content-list { position: relative; transition: transform .2s ease; }
  .line {
    display: flex; align-items: center; padding: 18px 28px; border-radius: 18px; margin-bottom: 14px;
    border: 3px solid transparent; font-size: 30px; min-height: 92px;
  }
  .line .ic { width: 56px; height: 56px; border-radius: 14px; margin-right: 26px; overflow: hidden; flex: 0 0 56px;
    display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; color: #fff; }
  .line .ic img { width: 100%; height: 100%; object-fit: contain; }
  .line .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .line .t small { display: block; font-size: 22px; opacity: .45; margin-top: 4px; }
  .act { font-size: 24px; padding: 10px 22px; border-radius: 12px; background: rgba(128,128,128,.18); margin-left: 14px; border: 3px solid transparent; }
  .act.del { color: #ff8a8a; }
  .sw { width: 92px; height: 50px; border-radius: 25px; background: rgba(128,128,128,.45); position: relative; flex: 0 0 92px; }
  .sw::after { content: ''; position: absolute; top: 5px; left: 5px; width: 40px; height: 40px; border-radius: 50%; background: #d8dde5; }
  .sw.on { background: #2f8f5b; } .sw.on::after { left: 47px; background: #fff; }
  .swatches { display: flex; flex-wrap: wrap; }
  .chip { width: 250px; margin: 0 30px 34px 0; }
  .chip .c { height: 140px; border-radius: 22px; border: 4px solid transparent; display: flex; align-items: flex-end; padding: 16px 20px; font-size: 40px; font-weight: 300; }
  .chip.sel .lbl { font-weight: 600; opacity: 1; }
  .chip .lbl { font-size: 26px; margin-top: 12px; opacity: .8; }
  .chip.cur .c::after { content: '✓'; margin-left: auto; font-size: 34px; }
  .field { width: 800px; font-size: 34px; padding: 18px 24px; border-radius: 14px; border: 3px solid transparent; color: inherit; outline: none; margin-bottom: 22px; }
  .res-item { width: 800px; font-size: 30px; padding: 18px 24px; border-radius: 14px; margin-bottom: 10px; border: 3px solid transparent; }
  .res-item small { opacity: .5; font-size: 24px; margin-left: 12px; }
  .credit { position: absolute; left: 110px; bottom: 60px; font-size: 22px; opacity: .4; }
  .help p { font-size: 28px; line-height: 1.6; opacity: .85; margin-bottom: 18px; }

  /* favori formu */
  #form { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; background: rgba(5,7,10,.85); display: none; justify-content: center; padding-top: 150px; color: #f2f2f2; }
  #form.on { display: flex; }
  #form .box { width: 1000px; height: 680px; background: #161c26; border-radius: 28px; padding: 50px 60px; }
  #form h2 { font-size: 42px; font-weight: 600; margin-bottom: 20px; }
  #form label { display: block; font-size: 26px; opacity: .55; margin: 22px 0 8px; }
  #form input { width: 100%; font-size: 34px; padding: 18px 24px; border-radius: 14px; color: #fff; background: rgba(255,255,255,.08); border: 3px solid transparent; outline: none; }
  #form input.f { border-color: #fff !important; background: rgba(255,255,255,.14); }
  #form .btns { display: flex; margin-top: 40px; }
  #form .btn { font-size: 30px; padding: 16px 40px; border-radius: 14px; background: rgba(255,255,255,.1); margin-right: 24px; border: 3px solid transparent; }
  #form .btn.f { border-color: #fff !important; background: rgba(255,255,255,.2); }
  #form .btn.del { color: #ff8a8a; }

  #toast { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; padding: 22px 44px; border-radius: 18px; font-size: 30px; opacity: 0; transition: opacity .2s; }
  #toast.show { opacity: 1; }
</style>
</head>
<body class="t-navy">
<div id="home">
  <div class="top" id="clockline"></div>
  <div class="title">Yıldız Ailesi Ev Eğlence Sistemi</div>
  <div id="gear">⚙</div>
  <div class="viewport" id="vp0"><div class="row" id="row0"></div></div>
  <div class="viewport" id="vp1"><div class="row" id="row1"></div></div>
  <div id="weather"></div>
</div>

<div id="settings">
  <div class="side"><h1>⚙ Ayarlar</h1><div id="menu"></div></div>
  <div class="main"><div id="content-list"></div><div class="credit" id="credit"></div></div>
</div>

<div id="form"><div class="box">
  <h2 id="form-title"></h2>
  <label>Ad</label><input id="f-name" type="text" placeholder="örn. Film">
  <label>Adres</label><input id="f-url" type="text" placeholder="örn. site.com">
  <label>Simge adresi (isteğe bağlı)</label><input id="f-icon" type="text" placeholder="boş bırakılırsa sitenin kendi simgesi">
  <div class="btns"><div class="btn" id="b-save">Kaydet</div><div class="btn" id="b-cancel">İptal</div></div>
</div></div>

<div id="toast"></div>
<script src="launcher.js"></script>
</body>
</html>
